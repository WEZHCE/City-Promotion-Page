<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>城市宣传页</title>
  <style>
    :root {
      --bg: #f4efe8;
      --paper: rgba(255, 255, 255, 0.76);
      --ink: #1f2937;
      --muted: #5b6472;
      --accent: #b45309;
      --accent-2: #0f766e;
      --line: rgba(31, 41, 55, 0.12);
      --shadow: 0 24px 80px rgba(31, 41, 55, 0.12);
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      font-family: Georgia, 'Times New Roman', serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(180, 83, 9, 0.18), transparent 28%),
        radial-gradient(circle at bottom right, rgba(15, 118, 110, 0.14), transparent 24%),
        linear-gradient(160deg, #faf6ef 0%, #f4efe8 45%, #ecf4f1 100%);
      display: grid;
      place-items: center;
      padding: 32px;
    }
    .shell {
      width: min(980px, 100%);
      background: var(--paper);
      backdrop-filter: blur(14px);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .hero {
      padding: clamp(32px, 6vw, 72px);
      border-bottom: 1px solid var(--line);
    }
    .eyebrow {
      display: inline-flex;
      gap: 10px;
      align-items: center;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 12px;
      color: var(--accent-2);
      margin-bottom: 18px;
    }
    .eyebrow::before {
      content: '';
      width: 42px;
      height: 1px;
      background: currentColor;
    }
    .title {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 0;
      max-width: none;
    }
    .title-cn,
    .title-en {
      white-space: nowrap;
      line-height: 1;
      display: block;
    }
    .title-cn {
      font-size: clamp(2.2rem, 5vw, 4.8rem);
      color: var(--ink);
      letter-spacing: 0.01em;
    }
    .title-en {
      font-size: clamp(0.98rem, 1.6vw, 1.35rem);
      color: var(--accent-2);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-family: Georgia, 'Times New Roman', serif;
    }
    .lede {
      max-width: 60ch;
      margin: 22px 0 0;
      color: var(--muted);
      font-size: 1.08rem;
      line-height: 1.8;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      padding: clamp(18px, 4vw, 32px);
    }
    .card {
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.58);
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: rgba(180, 83, 9, 0.3);
      box-shadow: 0 18px 40px rgba(31, 41, 55, 0.08);
    }
    .card h2 {
      margin: 0 0 10px;
      font-size: 1.4rem;
    }
    .card p {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.7;
    }
    .card a {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: white;
      background: linear-gradient(135deg, var(--accent), #c2410c);
      padding: 12px 18px;
      border-radius: 999px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .card.alt a {
      background: linear-gradient(135deg, var(--accent-2), #0f4c5c);
    }
    .footer {
      padding: 0 32px 32px;
      color: var(--muted);
      font-size: 0.95rem;
    }
    @media (max-width: 700px) {
      body { padding: 16px; }
      .grid { grid-template-columns: 1fr; }
      .title-cn { font-size: clamp(2rem, 11vw, 3rem); }
      .title-en { font-size: 0.9rem; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div class="eyebrow">城市宣传页</div>
      <h1 class="title">
        <span class="title-cn">看见城市的故事</span>
        <span class="title-en">See the Stories of the City</span>
      </h1>
      <p class="lede">这里收集了本仓库里的两个城市宣传页面，点击下方入口即可预览每座城市的视觉风格。</p>
    </section>
    <section class="grid" aria-label="城市页面">
      <article class="card">
        <h2>南阳</h2>
        <p>打开南阳城市宣传页，浏览瑞士风格的视觉语言和更完整的城市展示。</p>
        <a href="nanyang.html">打开南阳页面</a>
      </article>
      <article class="card alt">
        <h2>武汉</h2>
        <p>打开武汉瑞士风格页面，看看另一套城市排版与版式表现。</p>
        <a href="wuhan-swiss-style.html">打开武汉页面</a>
      </article>
    </section>
    <div class="footer">选择一个城市页面继续浏览。</div>
  </main>
</body>
</html>
